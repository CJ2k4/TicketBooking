spring:
  application:
    name: ShowZzz

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/seatbooking}
    username: ${DB_USERNAME:seat}
    password: ${DB_PASSWORD:seat}
    hikari:
      maximum-pool-size: 20
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: true
    properties:
      hibernate:
        jdbc.time_zone: UTC

  flyway:
    enabled: true

booking:
  hold-duration: PT5M
  max-seats-per-hold: 6
#  sweeper-interval-ms: 30000
